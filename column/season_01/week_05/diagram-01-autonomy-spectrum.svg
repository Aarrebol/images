<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">自治不是开关，而是一条光谱</title>
  <desc id="desc">从固定工作流到自主 Agent，模型决策权逐渐增加，但规则、验证、预算、审批和人工接管始终贯穿全程。</desc>
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa8d8"/><stop offset="0.52" stop-color="#8b78c8"/><stop offset="1" stop-color="#d87965"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#26384a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#f6f8fb"/>
  <text x="600" y="62" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#1f3347">自治不是开关，而是一条光谱</text>
  <text x="600" y="102" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#617386">关键问题：每一步由程序、模型还是人决定？</text>

  <text x="105" y="164" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#3e5b76">程序预先决定路径</text>
  <text x="1095" y="164" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#8a493e">模型动态决定路径</text>
  <rect x="105" y="182" width="990" height="18" rx="9" fill="url(#spectrum)"/>
  <path d="M1095 174 L1130 191 L1095 208 Z" fill="#d87965"/>

  <g font-family="Microsoft YaHei, sans-serif" filter="url(#shadow)">
    <rect x="70" y="238" width="235" height="145" rx="20" fill="#eef6ff" stroke="#7aa8d8" stroke-width="2"/>
    <text x="187" y="287" text-anchor="middle" font-size="28" font-weight="700" fill="#2e5478">固定工作流</text>
    <text x="187" y="329" text-anchor="middle" font-size="22" fill="#587087">顺序与分支写在代码里</text>
    <text x="187" y="359" text-anchor="middle" font-size="20" fill="#708395">适合稳定、可枚举任务</text>

    <rect x="335" y="238" width="235" height="145" rx="20" fill="#f1f2ff" stroke="#8589cd" stroke-width="2"/>
    <text x="452" y="287" text-anchor="middle" font-size="28" font-weight="700" fill="#4d508b">路由 / 并行</text>
    <text x="452" y="329" text-anchor="middle" font-size="22" fill="#66698e">模型选择预定义分支</text>
    <text x="452" y="359" text-anchor="middle" font-size="20" fill="#7d7f9d">控制面仍由程序掌握</text>

    <rect x="600" y="238" width="235" height="145" rx="20" fill="#f7efff" stroke="#9b75c5" stroke-width="2"/>
    <text x="717" y="287" text-anchor="middle" font-size="28" font-weight="700" fill="#654184">混合编排</text>
    <text x="717" y="329" text-anchor="middle" font-size="22" fill="#735d87">固定外框 + 局部探索</text>
    <text x="717" y="359" text-anchor="middle" font-size="20" fill="#89769a">多数业务的实用形态</text>

    <rect x="865" y="238" width="265" height="145" rx="20" fill="#fff1ed" stroke="#d87965" stroke-width="2"/>
    <text x="997" y="287" text-anchor="middle" font-size="28" font-weight="700" fill="#8b493d">自主 Agent</text>
    <text x="997" y="329" text-anchor="middle" font-size="22" fill="#87655e">动态规划、选工具、修正</text>
    <text x="997" y="359" text-anchor="middle" font-size="20" fill="#9d7b74">适合难以预写的路径</text>
  </g>

  <text x="70" y="443" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#263f56">画边界前，先问四件事</text>
  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="70" y="470" width="245" height="92" rx="16" fill="#ffffff" stroke="#b3c1ce"/>
    <text x="192" y="510" text-anchor="middle" font-size="23" font-weight="700" fill="#334e68">路径能否枚举？</text><text x="192" y="542" text-anchor="middle" font-size="19" fill="#6d7f90">未知步骤越多，自治越有用</text>
    <rect x="340" y="470" width="245" height="92" rx="16" fill="#ffffff" stroke="#b3c1ce"/>
    <text x="462" y="510" text-anchor="middle" font-size="23" font-weight="700" fill="#334e68">结果能否验证？</text><text x="462" y="542" text-anchor="middle" font-size="19" fill="#6d7f90">有反馈，才有机会纠错</text>
    <rect x="610" y="470" width="245" height="92" rx="16" fill="#ffffff" stroke="#b3c1ce"/>
    <text x="732" y="510" text-anchor="middle" font-size="23" font-weight="700" fill="#334e68">动作能否撤回？</text><text x="732" y="542" text-anchor="middle" font-size="19" fill="#6d7f90">不可逆动作收紧控制</text>
    <rect x="880" y="470" width="250" height="92" rx="16" fill="#ffffff" stroke="#b3c1ce"/>
    <text x="1005" y="510" text-anchor="middle" font-size="23" font-weight="700" fill="#334e68">失败影响多大？</text><text x="1005" y="542" text-anchor="middle" font-size="19" fill="#6d7f90">风险越高，外框越强</text>
  </g>

  <rect x="70" y="620" width="1060" height="115" rx="22" fill="#20384e"/>
  <text x="600" y="666" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#ffffff">控制层始终存在</text>
  <text x="600" y="710" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#afe0ca">规则　＋　结构化验证　＋　预算　＋　审批　＋　人工接管</text>
</svg>
