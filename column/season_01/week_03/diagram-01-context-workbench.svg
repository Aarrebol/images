<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#F7F9FC"/>
  <text x="600" y="56" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="34" font-weight="700" fill="#17233C">上下文是工作台，不是仓库</text>
  <text x="600" y="94" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="21" fill="#58657A">Harness 为当前决策选择最小但充分的高信号信息</text>

  <rect x="45" y="145" width="270" height="560" rx="28" fill="#EEF1F5" stroke="#7D8CA5" stroke-width="3"/>
  <text x="180" y="195" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="29" font-weight="700" fill="#34435A">外部信息仓库</text>
  <text x="180" y="230" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="19" fill="#67758A">保留完整、可回溯的资料</text>

  <rect x="78" y="270" width="204" height="70" rx="14" fill="#FFFFFF" stroke="#A7B0C0" stroke-width="2"/>
  <text x="180" y="313" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" fill="#34435A">文档与代码</text>
  <rect x="78" y="365" width="204" height="70" rx="14" fill="#FFFFFF" stroke="#A7B0C0" stroke-width="2"/>
  <text x="180" y="408" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" fill="#34435A">工具目录</text>
  <rect x="78" y="460" width="204" height="70" rx="14" fill="#FFFFFF" stroke="#A7B0C0" stroke-width="2"/>
  <text x="180" y="503" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" fill="#34435A">历史与完整日志</text>
  <rect x="78" y="555" width="204" height="70" rx="14" fill="#FFFFFF" stroke="#A7B0C0" stroke-width="2"/>
  <text x="180" y="598" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" fill="#34435A">任务状态与工件</text>

  <rect x="380" y="230" width="260" height="390" rx="28" fill="#EAF2FF" stroke="#2F6FEB" stroke-width="4"/>
  <text x="510" y="285" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="700" fill="#174EA6">Harness</text>
  <text x="510" y="325" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" fill="#3D5E91">组装当前上下文</text>
  <rect x="420" y="365" width="180" height="55" rx="13" fill="#FFFFFF" stroke="#5A8DEE" stroke-width="2"/>
  <text x="510" y="400" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#174EA6">选择</text>
  <rect x="420" y="440" width="180" height="55" rx="13" fill="#FFFFFF" stroke="#5A8DEE" stroke-width="2"/>
  <text x="510" y="475" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#174EA6">排序</text>
  <rect x="420" y="515" width="180" height="55" rx="13" fill="#FFFFFF" stroke="#5A8DEE" stroke-width="2"/>
  <text x="510" y="550" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#174EA6">压缩与外置</text>

  <rect x="710" y="145" width="330" height="560" rx="28" fill="#F3EDFF" stroke="#7A4CE0" stroke-width="4"/>
  <text x="875" y="195" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="29" font-weight="700" fill="#5C35B5">Context Window</text>
  <text x="875" y="230" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="19" fill="#684F91">模型当前可见的工作台</text>
  <rect x="750" y="270" width="250" height="75" rx="14" fill="#FFFFFF" stroke="#9B74E8" stroke-width="2"/>
  <text x="875" y="316" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" fill="#5C35B5">核心规则</text>
  <rect x="750" y="370" width="250" height="75" rx="14" fill="#FFFFFF" stroke="#9B74E8" stroke-width="2"/>
  <text x="875" y="416" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" fill="#5C35B5">当前目标与状态</text>
  <rect x="750" y="470" width="250" height="75" rx="14" fill="#FFFFFF" stroke="#9B74E8" stroke-width="2"/>
  <text x="875" y="516" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" fill="#5C35B5">必要证据与工具</text>
  <rect x="750" y="570" width="250" height="75" rx="14" fill="#FFF2E7" stroke="#E27A24" stroke-width="2"/>
  <text x="875" y="616" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" fill="#B85B10">最近执行反馈</text>

  <rect x="1080" y="315" width="90" height="215" rx="24" fill="#FFFFFF" stroke="#7A4CE0" stroke-width="3"/>
  <text x="1125" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" font-weight="700" fill="#5C35B5">模</text>
  <text x="1125" y="425" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" font-weight="700" fill="#5C35B5">型</text>
  <text x="1125" y="480" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" fill="#684F91">下一步</text>

  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748B"/></marker><marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#E27A24"/></marker></defs>
  <path d="M315 425 L370 425" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="342" y="395" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" fill="#64748B">按需取回</text>
  <path d="M640 425 L700 425" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1040 425 L1070 425" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1125 535 C1125 735 850 760 850 655" fill="none" stroke="#E27A24" stroke-width="4" marker-end="url(#orangeArrow)"/>
  <text x="990" y="755" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" fill="#B85B10">动作结果成为下一轮反馈</text>
</svg>

